async function saveDeepSeekKey(){const v=$('#deepseekKeyInput')?.value.trim();if(!v)return toast('DeepSeek API 키를 입력해 주세요.');deepseekKey=v;try{sessionStorage.setItem('miguel_deepseek_session_key',v)}catch(e){}toast('DeepSeek 연결 확인 중이다.');try{await deepseekGenerate(true);data.aiProvider='deepseek';data.aiEnabled=true;save();alert('DeepSeek 연결 성공! 이제 미겔과 대화할 수 있다.')}catch(e){data.aiEnabled=false;save();alert('DeepSeek 연결 실패: '+String(e.message).slice(0,350)+'\\n기본 미겔 모드로 유지한다.')}render()}
async function send(){if(aiBusy)return;let v=$('#msg').value.trim();if(!v)return;const sent={me:true,text:v,date:today(),time:now(),read:false,id:Date.now()+'-'+Math.random()};data.chat.push(sent);gainAffection(v);save();render();aiBusy=true;const useAI=data.aiEnabled&&!!(data.aiProvider==='deepseek'?deepseekKey:aiKey);let answer='';if(useAI){try{const recent=data.chat.slice(-18).map(m=>({role:m.me?'user':'model',parts:[{text:m.text}]}));answer=data.aiProvider==='deepseek'?await deepseekGenerate():await geminiGenerate(recent)}catch(e){console.warn('AI fallback:',e);answer=miguelDada(replyMiguel(v));toast('AI 응답 실패 · 기본 미겔로 답장한다.')}}else{await new Promise(r=>setTimeout(r,1800+Math.floor(Math.random()*2400)));answer=miguelDada(replyMiguel(v))}const m=data.chat.find(x=>x.id===sent.id);if(m)m.read=true;data.chat.push({me:false,text:answer,date:today(),time:now(),id:'miguel-'+Date.now()+'-'+Math.random().toString(36).slice(2)});save();aiBusy=false;if(page==='chat')render()}
function stamp(){if(data.stamps.includes(today()))return;data.stamps.push(today());save();render();toast('🍀 오늘의 도장을 찍었다.')}function pickPhoto(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{photo=reader.result;render()};reader.readAsDataURL(f)}function savePhoto(){if(!photo)return toast('사진을 먼저 선택해 주세요.');data.photos.unshift({image:photo,caption,stickers:[...stickers],date:today(),theme:data.photoTheme});save();photo='';caption='';stickers=[];go('gallery');toast('폴라로이드를 보관했습니다.')}function addEntry(k){let t=$('#entry').value.trim();if(!t)return;data[k].unshift({date:today(),text:t});save();render()}function addDay(){let name=$('#eventName').value,date=$('#eventDate').value;if(!date)return toast('날짜를 선택해 주세요.');data.ddays.push({name:name||'기념일',date});save();render()}function del(k,i){if(confirm('삭제할까요?')){data[k].splice(i,1);save();render()}}function addCapsule(){let d=$('#openDate').value,t=$('#capText').value.trim();if(!d||!t)return toast('날짜와 내용을 입력해 주세요.');if(d<=today())return toast('미래 날짜를 선택해 주세요.');data.capsules.unshift({date:d,text:t});save();render()}function searchLocal(){let q=$('#searchText').value.toLowerCase();let items=[...data.chat.map(x=>({title:'채팅',text:x.text})),...data.notes.map(x=>({title:'메모',text:x.text})),...data.diary.map(x=>({title:'일기',text:x.text}))];$('#searchResults').innerHTML=q?items.filter(x=>x.text.toLowerCase().includes(q)).slice(0,40).map(x=>`<div class="panel"><b>${x.title}</b><p>${safe(x.text)}</p></div>`).join('')||'<p>검색 결과가 없습니다.</p>':''}function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='miguel-cotreeman-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(s=>{try{let d=JSON.parse(s);if(!d||typeof d!=='object'||Array.isArray(d))throw Error();data=d;save();location.reload()}catch{toast('올바른 백업  }
}

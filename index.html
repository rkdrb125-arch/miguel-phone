function addArchiveLog(folder){const title=prompt('로그 제목을 입력해 주세요.');if(!title?.trim())return;const url=prompt('원문 링크를 입력해 주세요. (https://...)');if(!url||!/^https:\/\//i.test(url.trim()))return toast('https://로 시작하는 링크를 입력해 주세요.');const desc=prompt('간단한 설명 (선택 사항)')||'';(data.archiveExtra[folder]??=[]).push({title:title.trim(),url:url.trim(),desc:desc.trim()});save();render();}

const foodVegetableSides=['데친 브로콜리','당근·오이 스틱','구운 파프리카','애호박볶음','양배추찜','숙주나물','가지구이','시금치나물','버섯볶음'];
const foodBasePlans=foodPlans;
for(const goal of Object.keys(foodBasePlans)){
  foodPlans[goal]=foodBasePlans[goal].flatMap((meal,baseIndex)=>foodVegetableSides.map((side,variant)=>{
    const parts=meal[1].split(' + ');
    // Include a vegetable side in every meal, and preserve the original grain/protein elements.
    // Rotate the vegetable variation across the nine versions of each base meal.
    const chosen=foodVegetableSides[(variant+baseIndex)%foodVegetableSides.length];
    const mealText=parts.join(' + ')+' + '+chosen;
    return [meal[0].replace(' 급식형 한 상','')+' · 채소 구성 '+(variant+1),mealText,
      meal[2]+' 채소 반찬을 곁들여 식품 다양성을 높인다. 개인의 알레르기와 식사량에 맞게 조절한다.'];
  }));
}
// Shuffle without replacement: all options in a category appear once before recycling.
const foodDeckStorageKey='miguel_food_v34_decks';
let foodDecks={};
try{foodDecks=JSON.parse(localStorage.getItem(foodDeckStorageKey)||'{}')||{}}catch(e){foodDecks={}}
function foodNextIndex(goal,count){
  let deck=foodDecks[goal];
  if(!deck||deck.count!==count||!Array.isArray(deck.remaining)||!deck.remaining.length){
    let order=Array.from({length:count},(_,i)=>i);
    for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
    if(deck&&Number.isInteger(deck.last)&&count>1&&order[order.length-1]===deck.last){
      [order[0],order[order.length-1]]=[order[order.length-1],order[0]];
    }
    deck={count,remaining:order,last:-1};
  }
  const idx=deck.remaining.pop();deck.last=idx;foodDecks[goal]=deck;
  try{localStorage.setItem(foodDeckStorageKey,JSON.stringify(foodDecks))}catch(e){}
  return idx;

// Gemini evaluates relationship dynamics separately from character dialogue.
async function evaluateAffectionWithGemini(message){
 if(!aiKey || !data.aiEnabled || data.aiProvider!=='gemini')return false;
 if(dan()){data.affection=100;return true}
 const recent=data.chat.slice(-8,-1).map(m=>(m.me?'USER: ':'MIGUEL: ')+String(m.text).slice(0,240)).join('\n');
 const instructions=`Evaluate the LAST user message in the context of the prior dialogue, for fictional character Miguel's trust/affection. Current score ${data.affection} on -100..100. Be conservative. Casual chat, repeated greetings, superficial flattery, repeated compliments, and ordinary questions: 0. Meaningful, sustained empathy or earned trust: 1. Exceptionally significant positive event: 2 (rare). Disrespect or boundary violation: -2 to -4. Serious insults, coercion, threats: -5 to -8. If uncertain use 0. Do not reward keyword matching. Assess context and intent, including jokes and apologies. Return ONLY a JSON object {"delta": integer, "reason": "short Korean explanation"}, no markdown.`;
 const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),12000);
 try{
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(data.aiModel)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':aiKey},body:JSON.stringify({systemInstruction:{parts:[{text:instructions}]},contents:[{role:'user',parts:[{text:'Previous conversation:\n'+recent+'\n\nLAST USER MESSAGE:\n'+message.slice(0,1500)}]}],generationConfig:{temperature:0.1,maxOutputTokens:120,responseMimeType:'application/json'}}),signal:controller.signal});
  const j=await res.json();if(!res.ok)throw Error(j.error?.message||'평가 요청 실패');
  const raw=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'';
  const parsed=JSON.parse(raw);if(!Number.isFinite(parsed.delta))throw Error('평가 응답 오류');
  let delta=Math.max(-8,Math.min(2,Math.trunc(parsed.delta)));
  // Earned affection is intentionally slow; one +1 for every three positive assessments.
  data.affectionProgress??=0;
  if(delta>0){data.affectionProgress+=delta;delta=0;if(data.affectionProgress>=3){delta=1;data.affectionProgress=0}}
  else if(delta<0)data.affectionProgress=0;
  const before=affectionStage();data.affection=Math.max(-100,Math.min(100,data.affection+delta));data.affectionEvents=(data.affectionEvents||0)+1;
  data.lastAffectionReason=String(parsed.reason||'').slice(0,90);
  data.lastAffectionDelta=delta;
  if(affectionStage()>before)toast('💚 미겔과의 관계가 조금 가까워졌습니다.');
  if(affectionStage()<before)toast('💔 미겔이 거리를 두기 시작했습니다.');
  save();return true;
 }finally{clearTimeout(timer)}
}

function playMusic(id){if(!/^[a-zA-Z0-9_-]{11}$/.test(id))return;document.getElementById('musicPlayerOverlay')?.remove();const d=document.createElement('div');d.id='musicPlayerOverlay';d.style.cssText='position:fixed;inset:0;z-index:99999;background:#101a17e8;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box';d.innerHTML=`<div style="width:min(100%,480px);background:#e7eddf;border-radius:22px;padding:15px;box-shadow:0 18px 55px #0008;color:#243a30"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><b>🎧 AURORA - The Seed</b><button aria-label="닫기" onclick="document.getElementById('musicPlayerOverlay').remove()" style="border:0;border-radius:50%;background:#ced9c8;font-size:20px;width:34px;height:34px;cursor:pointer">×</button></div><div style="position:relative;padding-top:56.25%;overflow:hidden;border-radius:13px;background:#111"><iframe title="유튜브 음악 재생" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p style="font-size:12px;line-height:1.5">재생이 시작되지 않으면 영상의 ▶ 버튼을 눌러 주세요. 일부 브라우저에서는 재생이 제한될 수 있어요.</p><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer" style="color:#365f50">유튜브에서 열기 ↗</a></div>`;document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)d.remove()})}

function cmPlayFoley(kind){
 if(!cmSoundOn)return false;
 const src=cmRecordedLikeSfx[kind];if(!src)return false;
 try{
  const player=new Audio(src);
  player.volume=(kind==='sizzle'?.22:kind==='slice'?.38:.3)*cmSoundVolume;
  player.play().catch(()=>cmSfxSynth(kind));
  return true;
 }catch(e){return false}
}
function cmSfxSynth(kind){switch(kind){
case 'slice':cmNoise(.09,.06,2100);break;
case 'mix':cmNoise(.1,.035,500,'lowpass');break;
case 'sizzle':cmNoise(.24,.07,2400,'highpass');break;
case 'bubble':cmTone(230,.11,'sine',.04,1.8);break;
case 'bite':cmNoise(.1,.025,400,'lowpass');break;
}}

function cmSfx(kind){
 if(cmPlayFoley(kind))return;
 if(!cmSoundOn)return;
 switch(kind){
 case 'tap':cmTone(610,.065,'sine',.05,1.22);break;
 case 'open':cmTone(500,.09,'triangle',.07,1.32);setTimeout(()=>cmTone(770,.13,'sine',.065,1.12),85);break;
 case 'slice':cmNoise(.095,.08,2350);cmTone(390,.055,'triangle',.026,.68);break;
 case 'mix':cmNoise(.105,.035,510,'lowpass');cmTone(230,.09,'sine',.028,.85);break;
 case 'plate':cmTone(650,.09,'sine',.055,1.3);cmNoise(.06,.022,1100);break;
 case 'bubble':cmTone(190+Math.random()*160,.11,'sine',.035,1.85);break;
 case 'sizzle':cmNoise(.24,.075,2400,'highpass');cmNoise(.16,.035,700);break;
 case 'egg':cmNoise(.07,.07,2400);cmTone(520,.06,'triangle',.06,.5);break;
 case 'success':cmTone(520,.11,'triangle',.065,1.2);setTimeout(()=>cmTone(780,.14,'triangle',.065,1.16),100);break;
 case 'perfect':cmTone(523,.12,'sine',.07,1);setTimeout(()=>cmTone(659,.12,'sine',.07,1),120);setTimeout(()=>cmTone(784,.23,'sine',.08,1),240);break;
 case 'fail':cmTone(320,.16,'triangle',.05,.72);break;
 case 'time':cmTone(420,.1,'square',.027,1);setTimeout(()=>cmTone(320,.16,'square',.025,.7),125);break;
 case 'bite':cmNoise(.09,.025,380,'lowpass');cmTone(250,.09,'sine',.045,.75);setTimeout(()=>cmTone(310,.1,'sine',.04,.85),130);break;
 case 'stars':cmTone(740,.13,'sine',.06,1.35);setTimeout(()=>cmTone(990,.21,'sine',.065,1.18),140);break;
 }
}

function cmStrokeScore(g,stage,ax,ay,bx,by,options={}){
 const rect=stage.getBoundingClientRect(),pts=g.cutPath||[];
 if(pts.length<2)return false;
 const vx=bx-ax,vy=by-ay,len=Math.hypot(vx,vy);
 if(len<12)return false;
 const width=options.width||Math.max(17,Math.min(32,rect.width*.075));
 let first=null,last=null,covered=new Set(),nearDistance=0,totalDistance=0,offDistance=0;
 const sample=(x,y)=>{
  const t=((x-ax)*vx+(y-ay)*vy)/(len*len);
  const deviation=Math.abs((x-ax)*vy-(y-ay)*vx)/len;
  if(deviation<=width&&t>=-.17&&t<=1.17){
   if(first===null)first=t;last=t;
   covered.add(Math.max(0,Math.min(9,Math.floor(t*10))));
   return true;

   body+='<div class="cook-stage cook-gesture-stage cm-playfield cm-step-'+cookStep+'" onpointerdown="cookTouchStart(event)" onpointermove="cookTouchMove(event)" onpointerup="cookTouchEnd(event)" onpointercancel="cookTouchCancel(event)">'+(cookStep===0&&peel?'<div class="cm-peel-scene"><div class="cm-peel-name">'+peel.name+' 껍질 벗기기</div><div class="cm-peel-fruit">'+peel.emoji+'<div class="cm-peel-strips">'+Array.from({length:5},(_,i)=>'<i class="'+(i<cookHits?'peeled':'')+'"></i>').join('')+'</div></div><div class="cm-peel-guide" style="left:'+(24+cookHits*12)+'%"><span>↓</span></div><div class="cm-peel-shavings">'+Array.from({length:cookHits},()=>'<span>〰️</span>').join('')+'</div></div>':cookStep===0?cookCutGuideHTML():cookStep===1?'<div class="cook-bowl"><div class="cook-bowl-food" style="transform:translate(-50%,-50%) rotate('+cookSpin+'deg)"><span class="cm-mix-veggie cm-mix-leaf"></span><span class="cm-mix-veggie cm-mix-tomato"></span><span class="cm-mix-veggie cm-mix-cucumber"></span><span class="cm-mix-veggie cm-mix-carrot"></span><span class="cm-mix-veggie cm-mix-pepper"></span><span class="cm-mix-veggie cm-mix-corn"></span></div><div class="cm-stir-orbit" aria-hidden="true"><svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="71" fill="none" stroke="#fffef2" stroke-width="10" opacity=".88"/><circle class="cm-stir-ring" cx="100" cy="100" r="71" fill="none" stroke="#4b9c61" stroke-width="5" stroke-linecap="round" stroke-dasharray="13 12"/><path d="M 148 48 L 174 49 L 167 75" fill="none" stroke="#357d4c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="cm-stir-orbit-icon">↻</span></div><div class="cm-stir-live">🥄 원을 따라 저어주세요 · '+cookStirPct()+'%</div></div>':'<div class="cm-plate-source"><span class="cm-plate-source-label">재료</span><span class="cm-plate-drag">'+['🥕','🥬','🍅','🫑'][cookHits]+'</span></div><div class="cm-plate-target"><span class="cm-plate-target-label">여기에 놓기 ↓</span><span class="cm-plate-dish">🍽️</span><span class="cm-plate-placed">'+['🥕','🥬','🍅','🫑'].slice(0,cookHits).join('')+'</span></div><div class="cm-plate-route">➜ ➜</div>')+(cookStep===3?'':'<span class="cook-tool">'+(cookStep===0?(peel?'🥔':cmKnifeIllustration()):'🥄')+'</span>')+'<div class="cm-fp-hands cm-fp-hands-'+cookStep+'" aria-hidden="true"><span class="cm-fp-arm cm-fp-left"><span class="cm-fp-palm"><i></i><i></i><i></i><i></i></span></span><span class="cm-fp-arm cm-fp-right"><span class="cm-fp-palm"><i></i><i></i><i></i><i></i></span></span></div>'+(cookStep===0&&!peel?'':'')+'</div><div class="cook-meter"><i style="width:'+(cookStep===1?cookStirPct():cookHits/target*100)+'%"></i></div><p class="cook-tip">'+(cookStep===0?(peel?'🥔 초록색 점선을 따라 위에서 아래로 길게 쓱! 껍질을 벗겨주세요.':'🔪 '+cookCutLabel()+' · 초록 점선을 따라 길게 드래그하세요.' ):cookStep===1?'🥄 초록색 원형 화살표를 따라 빙글빙글! 게이지가 차오릅니다.':'🍽️ 왼쪽 재료를 길게 잡고 오른쪽 접시 안에 놓으세요.')+(cookStep===1?' '+cookStirPct()+'%':' ('+cookHits+'/'+target+')')+'</p><div class="cook-gesture-feedback">'+cookPop+'</div>';
  }
  body+='<p class="cook-tip">'+cookFeedback+'</p><p class="cook-tip">⏰ 시간이 끝나면 점수 없이 자동으로 다음 단계로 넘어갑니다.</p>';
 }
 body+='</div>';
 }
 return '<section class="screen cook-shell">'+head('🍳 쿠킹 미겔')+'<div class="cm-soundbar"><span>🎵 게임 효과음</span><button type="button" aria-label="게임 효과음 켜기 또는 끄기" aria-pressed="'+cmSoundOn+'" onclick="cmToggleSound()">'+(cmSoundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐')+'</button><label class="cm-volume-label">크기 <input type="range" min="0" max="100" value="'+Math.round(cmSoundVolume*100)+'" oninput="cmSetSoundVolume(this.value)" aria-label="효과음 볼륨"></label></div>'+body+'</section>';
}
</script></body></html>
